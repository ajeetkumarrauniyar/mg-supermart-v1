services:
  - type: web
    name: mg-mart-server
    env: node
    region: oregon
    plan: starter
    buildCommand: |
      pnpm install --frozen-lockfile --prod=false
      pnpm --filter @mg-mart/server run build
    startCommand: pnpm --filter @mg-mart/server run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: GOOGLE_CUSTOM_SEARCH_API_KEY
        sync: false
      - key: GOOGLE_CUSTOM_SEARCH_ENGINE_ID
        sync: false
      - key: BING_SEARCH_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: MAX_IMAGE_SIZE_MB
        value: "10"
      - key: MAX_IMAGES_PER_PRODUCT
        value: "5"
      - key: IMAGE_QUALITY_THRESHOLD
        value: "0.7"
      - key: PROCESSING_TIMEOUT_MS
        value: "30000"
      # Store configuration. src/config/storeConfig.ts validates all eight at
      # startup and server.ts exits 1 on a ConfigError, so a deploy without
      # them fails the health check.
      - key: STORE_LAT
        sync: false
      - key: STORE_LNG
        sync: false
      - key: DELIVERY_RADIUS_KM
        sync: false
      - key: MIN_ORDER_VALUE
        sync: false
      # Fee amounts are per-environment and still undecided for production;
      # the 40 / 5 in .env.example are test placeholders. The *_WAIVED_AT keys
      # accept an empty value, which means the fee is never waived.
      - key: DELIVERY_FEE_AMOUNT
        sync: false
      - key: DELIVERY_FEE_WAIVED_AT
        sync: false
      - key: HANDLING_FEE_AMOUNT
        sync: false
      - key: HANDLING_FEE_WAIVED_AT
        sync: false
      # Written to order.shippingAddress.state for the admin panel; the address
      # model does not collect state.
      - key: LEGACY_SHIPPING_STATE
        sync: false
